<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob: https:; media-src blob:; style-src 'unsafe-inline' {{cspSource}}; script-src 'unsafe-inline' {{cspSource}}; connect-src {{cspSource}};" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>Android Emulator Viewer</title>
  </head>
  <body>
    <!-- Material Symbols are inlined as an SVG sprite: the webview CSP blocks
         Google's icon-font CDN, so the glyphs have to ship with the extension. -->
    <svg class="sprite" aria-hidden="true">
      <defs>

        </symbol>
        <symbol id="ic-zoom-out" viewBox="0 -960 960 960">

        </symbol>
        <symbol id="ic-recents" viewBox="0 -960 960 960">
          <path d="M200-200v-560h560v560H200Zm80-80h400v-400H280v400Z" />
        </symbol>
        <symbol id="ic-logs" viewBox="0 -960 960 960">

        </symbol>
        <symbol id="ic-phone" viewBox="0 -960 960 960">
          <path d="M280-40q-33 0-56.5-23.5T200-120v-720q0-33 23.5-56.5T280-920h400q33 0 56.5 23.5T760-840v720q0 33-23.5 56.5T680-40H280Zm0-120v40h400v-40H280Zm0-80h400v-480H280v480Zm0-560h400v-40H280v40Zm0 0v-40 40Zm0 640v40-40Z" />
        </symbol>
        <symbol id="ic-camera" viewBox="0 -960 960 960">
          <path d="M480-260q75 0 127.5-52.5T660-440q0-75-52.5-127.5T480-620q-75 0-127.5 52.5T300-440q0 75 52.5 127.5T480-260Zm0-80q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29ZM160-120q-33 0-56.5-23.5T80-200v-480q0-33 23.5-56.5T160-760h126l74-80h240l74 80h126q33 0 56.5 23.5T880-680v480q0 33-23.5 56.5T800-120H160Zm0-80h640v-480H638l-73-80H395l-73 80H160v480Z" />
        </symbol>
        <!-- The two rotate glyphs are exact mirrors of each other (the right
             variant is the left path with the X axis flipped via transform), so
             the direction is unmistakable at toolbar size. Material's stock
             rotate icons both curve the same way and read as identical here. -->
        <symbol id="ic-rotate-left" viewBox="0 -960 960 960">
          <path d="M360-160v-80h332q0-96-66.5-164T462-472h-88l104 104-56 56-200-200 200-200 56 56-104 104h88q131 0 224.5 92T784-240v80H360Zm-160 0v-80h80v80h-80Z" />
        </symbol>
        <symbol id="ic-rotate-right" viewBox="0 -960 960 960">
          <path transform="translate(960 0) scale(-1 1)" d="M360-160v-80h332q0-96-66.5-164T462-472h-88l104 104-56 56-200-200 200-200 56 56-104 104h88q131 0 224.5 92T784-240v80H360Zm-160 0v-80h80v80h-80Z" />
        </symbol>
        <symbol id="ic-tune" viewBox="0 -960 960 960">
          <path d="M440-120v-240h80v80h320v80H520v80h-80Zm-320-80v-80h240v80H120Zm160-160v-80H120v-80h160v-80h80v240h-80Zm160-80v-80h400v80H440Zm160-160v-240h80v80h160v80H680v80h-80Z" />
        </symbol>
        <symbol id="ic-close" viewBox="0 -960 960 960">
          <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
        </symbol>
        <symbol id="ic-battery" viewBox="0 -960 960 960">
          <path d="M320-80q-17 0-28.5-11.5T280-120v-640q0-17 11.5-28.5T320-800h80v-80h160v80h80q17 0 28.5 11.5T680-760v640q0 17-11.5 28.5T640-80H320Zm40-80h240v-560H360v560Z" />
        </symbol>
        <symbol id="ic-network" viewBox="0 -960 960 960">
          <path d="M40-120v-80h880v80H40Zm120-120v-200h120v200H160Zm200 0v-360h120v360H360Zm200 0v-520h120v520H560Z" />
        </symbol>
        <symbol id="ic-location" viewBox="0 -960 960 960">
          <path d="M480-480q33 0 56.5-23.5T560-560q0-33-23.5-56.5T480-640q-33 0-56.5 23.5T400-560q0 33 23.5 56.5T480-480Zm0 294q122-112 181-203.5T720-552q0-109-69.5-178.5T480-800q-101 0-170.5 69.5T240-552q0 71 59 162.5T480-186Zm0 106Q319-217 239.5-334.5T160-552q0-150 96.5-239T480-880q127 0 223.5 89T800-552q0 100-79.5 217.5T480-80Z" />
        </symbol>
        <symbol id="ic-call" viewBox="0 -960 960 960">
          <path d="M798-120q-125 0-247-54.5T329-329Q229-429 174.5-551T120-798q0-18 12-30t30-12h162q14 0 25 9.5t13 22.5l26 140q2 16-1 27t-11 19l-97 98q20 37 47.5 71.5T387-386q31 31 65 57.5t72 48.5l84-84q9-9 23.5-13.5T661-380l135 27q13 3 22.5 13t9.5 24v154q0 18-12 30t-30 12Z" />
        </symbol>
        <symbol id="ic-sms" viewBox="0 -960 960 960">
          <path d="M240-400h480v-80H240v80Zm0-120h480v-80H240v80Zm0-120h480v-80H240v80ZM80-80v-720q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v480q0 33-23.5 56.5T800-240H240L80-80Zm126-240h594v-480H160v525l46-45Z" />
        </symbol>
        <symbol id="ic-fingerprint" viewBox="0 -960 960 960">
          <path d="M480-40q-134 0-227-93t-93-227q0-134 93-227t227-93q134 0 227 93t93 227q0 134-93 227T480-40Zm0-80q100 0 170-70t70-170q0-100-70-170t-170-70q-100 0-170 70t-70 170q0 100 70 170t170 70Zm0-100q-75 0-127.5-52.5T300-400q0-75 52.5-127.5T480-580q75 0 127.5 52.5T660-400q0 75-52.5 127.5T480-220Zm0-80q42 0 71-29t29-71q0-42-29-71t-71-29q-42 0-71 29t-29 71q0 42 29 71t71 29Z" />
        </symbol>
      </defs>
    </svg>

    <header class="toolbar">
      <div class="toolbar__device">
        <svg class="icon icon--device"><use href="#ic-phone" /></svg>
        <select id="avdSelect" aria-label="Android Virtual Device"></select>
      </div>

      <div class="status" id="statusChip">
        <span class="status__dot" id="statusDot"></span>
        <span class="status__text" id="status">Idle</span>
      </div>

      <div class="toolbar__spacer"></div>

      <div class="segmented" role="group" aria-label="View size">
        <button id="fitHeightBtn" class="iconbtn" title="Fit to height">
          <svg class="icon"><use href="#ic-fit-height" /></svg>
        </button>
        <button id="fitWidthBtn" class="iconbtn" title="Fit to width">
          <svg class="icon"><use href="#ic-fit-width" /></svg>
        </button>
        <button id="zoomOutBtn" class="iconbtn" title="Zoom out">
          <svg class="icon"><use href="#ic-zoom-out" /></svg>
        </button>
        <span class="zoomlabel" id="zoomLabel">Fit</span>
        <button id="zoomInBtn" class="iconbtn" title="Zoom in">
          <svg class="icon"><use href="#ic-zoom-in" /></svg>
        </button>
      </div>

      <div class="divider"></div>

      <div class="segmented" role="group" aria-label="Hardware keys">
        <button id="navBackBtn" class="iconbtn" title="Back">
          <svg class="icon"><use href="#ic-back" /></svg>
        </button>
        <button id="navHomeBtn" class="iconbtn" title="Home">
          <svg class="icon"><use href="#ic-home" /></svg>
        </button>
        <button id="navRecentsBtn" class="iconbtn" title="Recent apps">
          <svg class="icon"><use href="#ic-recents" /></svg>
        </button>
      </div>

      <div class="divider"></div>

      <div class="actions">
        <button id="startBtn" class="iconbtn iconbtn--primary" title="Start emulator">
          <svg class="icon"><use href="#ic-play" /></svg>
        </button>
        <button id="stopBtn" class="iconbtn iconbtn--danger" title="Stop emulator">
          <svg class="icon"><use href="#ic-stop" /></svg>
        </button>
        <button id="refreshBtn" class="iconbtn" title="Refresh frame">
          <svg class="icon"><use href="#ic-refresh" /></svg>
        </button>
        <button id="logsBtn" class="iconbtn" title="Open logs in Output panel">
          <svg class="icon"><use href="#ic-logs" /></svg>
        </button>
      </div>
    </header>

    <!-- tabindex so the stage can take focus and receive key events -->
    <main class="stage" id="stage" tabindex="0">
      <div class="screen-frame" id="screenFrame">
        <canvas id="screen" width="1080" height="2340"></canvas>
      </div>
      <div class="placeholder" id="placeholder">
        <svg class="placeholder__icon"><use href="#ic-phone" /></svg>
        <p class="placeholder__title" id="placeholderTitle">No emulator running</p>
        <p class="placeholder__hint" id="placeholderHint">Pick an AVD and press start.</p>
      </div>

      <!-- Boot progress. Phases come from the extension as they actually happen,
           so this reflects real milestones rather than a timed animation. -->
      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="loader__phone">
          <svg class="loader__icon"><use href="#ic-phone" /></svg>
          <div class="loader__sweep"></div>
        </div>
        <p class="loader__title" id="loaderTitle">Starting emulator…</p>
        <div class="loader__track"><div class="loader__fill" id="loaderFill"></div></div>
        <ol class="steps" id="loaderSteps">
          <li data-phase="starting">Launching emulator</li>
          <li data-phase="connected">Connecting over adb</li>
          <li data-phase="shell">Waiting for shell</li>
          <li data-phase="booting">Booting Android</li>
          <li data-phase="streaming">Starting stream</li>
        </ol>
        <p class="loader__elapsed" id="loaderElapsed"></p>
      </div>

      <!-- Floating tool panel. Draggable, so it can be moved off whatever part
           of the screen is being worked on; only shown while streaming. -->
      <div class="tools" id="tools" role="toolbar" aria-label="Emulator tools">
        <div class="tools__grip" id="toolsGrip" title="Drag to move">
          <span></span><span></span>
        </div>
        <button id="shotBtn" class="toolbtn" title="Take screenshot">
          <svg class="icon"><use href="#ic-camera" /></svg>
        </button>
        <button id="rotateLeftBtn" class="toolbtn" title="Rotate left">
          <svg class="icon"><use href="#ic-rotate-left" /></svg>
        </button>
        <button id="rotateRightBtn" class="toolbtn" title="Rotate right">
          <svg class="icon"><use href="#ic-rotate-right" /></svg>
        </button>
        <button id="extendedBtn" class="toolbtn" title="Extended controls" aria-expanded="false">
          <svg class="icon"><use href="#ic-tune" /></svg>
        </button>
      </div>

      <!-- Extended controls. The emulator runs headless (-no-window), so its
           native Qt panel is unavailable; these drive the same state over the
           emulator console via `adb emu`. -->
      <aside class="ext" id="ext" aria-label="Extended controls" aria-hidden="true">
        <header class="ext__head">
          <svg class="icon"><use href="#ic-tune" /></svg>
          <h2 class="ext__title">Extended controls</h2>
          <button id="extCloseBtn" class="toolbtn toolbtn--bare" title="Close">
            <svg class="icon"><use href="#ic-close" /></svg>
          </button>
        </header>

        <div class="ext__body">
          <section class="ext__group">
            <h3 class="ext__label"><svg class="icon icon--sm"><use href="#ic-battery" /></svg>Battery</h3>
            <div class="field">
              <label for="battLevel">Charge level</label>
              <div class="field__row">
                <input type="range" id="battLevel" min="0" max="100" step="1" value="100" />
                <output class="field__out" id="battLevelOut">100%</output>
              </div>
            </div>
            <div class="field">
              <label for="battStatus">Charger</label>
              <select id="battStatus">
                <option value="ac">AC charger</option>
                <option value="usb">USB charger</option>
                <option value="none">None (on battery)</option>
              </select>
            </div>
            <div class="field">
              <label for="battHealth">Health</label>
              <select id="battHealth">
                <option value="good">Good</option>
                <option value="overheat">Overheated</option>
                <option value="dead">Dead</option>
                <option value="overvoltage">Overvoltage</option>
                <option value="failure">Failure</option>
              </select>
            </div>
          </section>

          <section class="ext__group">
            <h3 class="ext__label"><svg class="icon icon--sm"><use href="#ic-network" /></svg>Cellular</h3>
            <div class="field">
              <label for="netType">Network type</label>
              <select id="netType">
                <option value="lte">LTE</option>
                <option value="gsm">GSM</option>
                <option value="hscsd">HSCSD</option>
                <option value="gprs">GPRS</option>
                <option value="edge">EDGE</option>
                <option value="umts">UMTS / 3G</option>
                <option value="hsdpa">HSDPA</option>
                <option value="full">Full (no limit)</option>
              </select>
            </div>
            <div class="field">
              <label for="netStatus">Voice / data status</label>
              <select id="netStatus">
                <option value="home">Home</option>
                <option value="roaming">Roaming</option>
                <option value="searching">Searching</option>
                <option value="denied">Denied (emergency only)</option>
                <option value="unregistered">Unregistered (off)</option>
              </select>
            </div>
            <div class="field">
              <label for="netSignal">Signal strength</label>
              <div class="field__row">
                <input type="range" id="netSignal" min="0" max="4" step="1" value="4" />
                <output class="field__out" id="netSignalOut">Great</output>
              </div>
            </div>
          </section>

          <section class="ext__group">
            <h3 class="ext__label"><svg class="icon icon--sm"><use href="#ic-location" /></svg>Location</h3>
            <div class="field field--split">
              <div>
                <label for="locLat">Latitude</label>
                <input type="text" id="locLat" inputmode="decimal" value="-36.8485" />
              </div>
              <div>
                <label for="locLng">Longitude</label>
                <input type="text" id="locLng" inputmode="decimal" value="174.7633" />
              </div>
            </div>
            <div class="field">
              <label for="locAlt">Altitude (m)</label>
              <input type="text" id="locAlt" inputmode="decimal" value="0" />
            </div>
            <button id="locSendBtn" class="btn">Send location</button>
          </section>

          <section class="ext__group">
            <h3 class="ext__label"><svg class="icon icon--sm"><use href="#ic-call" /></svg>Phone</h3>
            <div class="field">
              <label for="phoneNumber">From number</label>
              <input type="text" id="phoneNumber" inputmode="tel" value="5551234" />
            </div>
            <div class="field">
              <label for="smsBody">Message</label>
              <input type="text" id="smsBody" value="Test message" />
            </div>
            <div class="ext__actions">
              <button id="callBtn" class="btn">
                <svg class="icon icon--sm"><use href="#ic-call" /></svg>Call
              </button>
              <button id="callEndBtn" class="btn">End call</button>
              <button id="smsBtn" class="btn">
                <svg class="icon icon--sm"><use href="#ic-sms" /></svg>Send SMS
              </button>
            </div>
          </section>

          <section class="ext__group">
            <h3 class="ext__label"><svg class="icon icon--sm"><use href="#ic-fingerprint" /></svg>Fingerprint</h3>
            <div class="field">
              <label for="fingerId">Finger ID</label>
              <select id="fingerId">
                <option value="1">Finger 1</option>
                <option value="2">Finger 2</option>
                <option value="3">Finger 3</option>
              </select>
            </div>
            <button id="fingerTouchBtn" class="btn">Touch sensor</button>
          </section>
        </div>
      </aside>
    </main>

    <script src="{{scriptUri}}"></script>
  </body>
</html>
